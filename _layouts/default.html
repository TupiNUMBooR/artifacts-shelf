<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>

  <style>
    :root {
      --bg: #1a1a1a;
      --panel: #333;
      --text: #fff;
      --link: #9f0;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      line-height: 1.55;
    }

    a {
      color: var(--link);
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 36px 18px;
    }

    img {
      max-width: 100%;
      border-radius: 12px;
    }

    .language-bar {
      display: none;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .language-select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--link);
      border-radius: 10px;
      padding: 8px 12px;
      font: inherit;
      outline: none;
    }

    .language-select:focus {
      box-shadow: 0 0 0 2px #9f04;
    }

    .content {
      background: var(--panel);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 0 20px #0008;
    }

    .content.hidden {
      display: none;
    }

    h1 {
      border-bottom: 2px solid var(--link);
      padding-bottom: 8px;
      margin-top: 48px;
    }

    h1:first-child {
      margin-top: 0;
    }

    .content.enhanced {
      background: transparent;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
    }

    .panel {
      background: var(--panel);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 32px;
      box-shadow: 0 0 20px #0008;
    }

    .panel h1 {
      margin-top: 0;
    }
  </style>
</head>

<body>
  <main>
    <div id="language-bar" class="language-bar">
      <select id="language-select" class="language-select" aria-label="Language">
        <option value="en">English</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    {{ content }}
  </main>

  <script>
    (() => {
      const contents = {
        en: document.getElementById('content-en'),
        ru: document.getElementById('content-ru')
      };

      const languageBar = document.getElementById('language-bar');
      const languageSelect = document.getElementById('language-select');

      const availableLanguages = Object
        .entries(contents)
        .filter(([, element]) => element);

      if (availableLanguages.length === 0) {
        return;
      }

      function enhanceContent(content) {
        if (!content || content.dataset.enhanced === 'true') {
          return;
        }

        const nodes = Array.from(content.childNodes);
        let panel = null;
        const panels = [];

        for (const node of nodes) {
          const isHeading =
            node.nodeType === Node.ELEMENT_NODE &&
            node.tagName === 'H1';

          if (isHeading) {
            panel = document.createElement('section');
            panel.className = 'panel';
            panels.push(panel);
          }

          if (panel) {
            panel.appendChild(node);
          }
        }

        if (panels.length === 0) {
          return;
        }

        content.textContent = '';
        content.classList.add('enhanced');
        content.dataset.enhanced = 'true';

        for (const item of panels) {
          content.appendChild(item);
        }
      }

      function normalizeLanguage(language) {
        return language && language.toLowerCase().startsWith('ru')
          ? 'ru'
          : 'en';
      }

      function getInitialLanguage() {
        const saved = localStorage.getItem('artifact-shelf-language');

        if (saved === 'en' || saved === 'ru') {
          return saved;
        }

        return normalizeLanguage(navigator.language);
      }

      function showLanguage(language) {
        const selectedLanguage = contents[language] ? language : 'en';

        for (const [key, content] of Object.entries(contents)) {
          if (!content) {
            continue;
          }

          content.classList.toggle('hidden', key !== selectedLanguage);
        }

        enhanceContent(contents[selectedLanguage]);

        languageSelect.value = selectedLanguage;
        localStorage.setItem('artifact-shelf-language', selectedLanguage);
      }

      languageBar.style.display = 'flex';
      showLanguage(getInitialLanguage());

      languageSelect.addEventListener('change', () => {
        showLanguage(languageSelect.value);
      });
    })();
  </script>
</body>
</html>
