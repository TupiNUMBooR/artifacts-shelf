<!doctype html>
<html>
<head>
  <!-- version: 2026-05-06-14-10-refactor -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link id="favicon" rel="icon" type="image/svg+xml" href="assets/favicon-1.svg">
  <title>{{ page.title }}</title>

  <style>
    :root {
      --bg: #1a1a1a;
      --panel: #333;
      --text: #fff;
      --link: #9f0;
      --cyan: #20f7ff;
      --violet: #b020ff;
      --muted-pixel: #60606a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    a {
      color: var(--link);
    }

    main {
      width: min(100% - 24px, 1200px);
      margin: 0 auto;
      padding: clamp(18px, 4vw, 36px) 0;
    }

    img,
    video,
    iframe {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
    }

    pre {
      max-width: 100%;
      overflow-x: auto;
    }

    table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
    }

    h1,
    h2 {
      border-bottom: 2px solid var(--link);
      padding-bottom: 8px;
      line-height: 1.15;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 4vw, 3rem);
    }

    h2 {
      margin: 0 0 18px;
      font-size: clamp(1.7rem, 3vw, 2.35rem);
    }

    .language-bar {
      display: none;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .language-select {
      max-width: 100%;
      padding: 8px 12px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--link);
      border-radius: 10px;
      font: inherit;
      outline: none;
    }

    .language-select:focus {
      box-shadow: 0 0 0 2px #9f04;
    }

    .content {
      background: var(--panel);
      border-radius: 18px;
      padding: clamp(16px, 4vw, 24px);
      box-shadow: 0 0 20px #0008;
    }

    .content.hidden {
      display: none;
    }

    .content.enhanced {
      background: transparent;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
    }

    .panel {
      position: relative;
      overflow: hidden;
      margin-bottom: clamp(18px, 5vw, 32px);
      padding: clamp(16px, 4vw, 24px);
      background: var(--panel);
      border-radius: 18px;
      box-shadow: 0 0 20px #0008;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background:
        radial-gradient(circle at 20% 0%, #9f03, transparent 34%),
        radial-gradient(circle at 90% 20%, #20f7ff22, transparent 26%);
    }

    .panel > * {
      position: relative;
      z-index: 1;
    }

    .panel.hero {
      padding-block: clamp(22px, 5vw, 34px);
    }

    .panel.hero h1 {
      margin-bottom: 0;
    }

    .panel h1,
    .panel h2 {
      margin-top: 0;
    }

    .panel > :last-child {
      margin-bottom: 0;
    }

    .pixel-brush-particle {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 99999;
      width: var(--size);
      height: var(--size);
      border: 2px solid var(--color);
      pointer-events: none;
      opacity: 0;
      box-shadow:
        0 0 8px var(--color),
        inset 0 0 4px #000;
      animation: pixel-brush-drift var(--life) linear forwards;
    }

    .pixel-brush-particle::after {
      content: "";
      position: absolute;
      inset: 35%;
      background: var(--color);
      opacity: 0.85;
      box-shadow: 0 0 6px var(--color);
    }

    @keyframes pixel-brush-drift {
      0% {
        opacity: 0;
        transform:
          translate(var(--x), var(--y))
          rotate(var(--rotation))
          scale(0.35);
      }

      12% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform:
          translate(
            calc(var(--x) + var(--dx)),
            calc(var(--y) + var(--dy))
          )
          rotate(calc(var(--rotation) + var(--spin)))
          scale(0.9);
      }
    }

    @media (max-width: 520px) {
      main {
        width: min(100% - 16px, 960px);
      }

      .language-bar {
        justify-content: stretch;
      }

      .language-select {
        width: 100%;
      }

      .content,
      .panel {
        border-radius: 14px;
      }

      h1 {
        font-size: 1.75rem;
      }

      h2 {
        font-size: 1.45rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <div id="language-bar" class="language-bar">
      <select id="language-select" class="language-select" aria-label="Language">
        <option value="en">English</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    {{ content }}
  </main>

  <script>
    (() => {
      const fallbackTitle = document.title;

      animateFavicon();
      initLanguage();
      initPixelBrushParticles();

      function animateFavicon() {
        const favicon = document.getElementById('favicon');

        if (!favicon) {
          return;
        }

        const frames = [
          'assets/favicon-1.svg',
          'assets/favicon-2.svg',
          'assets/favicon-3.svg',
          'assets/favicon-2.svg'
        ];

        let index = 0;

        setInterval(() => {
          index = (index + 1) % frames.length;
          favicon.href = frames[index];
        }, 700);
      }

      function initLanguage() {
        const contents = {
          en: document.getElementById('content-en'),
          ru: document.getElementById('content-ru')
        };

        const availableLanguages = Object
          .entries(contents)
          .filter(([, content]) => content);

        if (availableLanguages.length === 0) {
          return;
        }

        const languageBar = document.getElementById('language-bar');
        const languageSelect = document.getElementById('language-select');

        languageBar.style.display = 'flex';
        showLanguage(getInitialLanguage());

        languageSelect.addEventListener('change', () => {
          showLanguage(languageSelect.value);
        });

        function showLanguage(language) {
          const selectedLanguage = contents[language] ? language : 'en';

          for (const [key, content] of Object.entries(contents)) {
            if (content) {
              content.classList.toggle('hidden', key !== selectedLanguage);
            }
          }

          const content = contents[selectedLanguage];

          enhanceContent(content);
          syncPageTitle(content);

          languageSelect.value = selectedLanguage;
          localStorage.setItem('artifact-shelf-language', selectedLanguage);
        }

        function getInitialLanguage() {
          const saved = localStorage.getItem('artifact-shelf-language');

          if (saved === 'en' || saved === 'ru') {
            return saved;
          }

          return navigator.language.toLowerCase().startsWith('ru')
            ? 'ru'
            : 'en';
        }
      }

      function enhanceContent(content) {
        if (!content || content.dataset.enhanced === 'true') {
          return;
        }

        const panels = [];
        let panel = null;

        for (const node of Array.from(content.childNodes)) {
          const isHeading =
            node.nodeType === Node.ELEMENT_NODE &&
            (node.tagName === 'H1' || node.tagName === 'H2');

          if (isHeading) {
            panel = document.createElement('section');
            panel.className = node.tagName === 'H1'
              ? 'panel hero'
              : 'panel';
            panels.push(panel);
          }

          if (panel) {
            panel.appendChild(node);
          }
        }

        if (panels.length === 0) {
          return;
        }

        content.textContent = '';
        content.classList.add('enhanced');
        content.dataset.enhanced = 'true';
        content.append(...panels);
      }

      function syncPageTitle(content) {
        const heading = content && content.querySelector('h1');
        const title = heading && heading.textContent.trim();

        document.title = title || fallbackTitle;
      }

      function initPixelBrushParticles() {
        const image = Array
          .from(document.images)
          .find((img) => {
            const source = `${img.getAttribute('src') || ''} ${img.currentSrc || ''} ${img.src || ''}`;
            return source.toLowerCase().includes('pixel_ai_brush');
          });

        if (!image) {
          return;
        }

        const colors = ['#9f0', '#20f7ff', '#b020ff', '#60606a'];
        let isHovering = false;
        let x = 0;
        let y = 0;
        let lastSpawnAt = 0;

        image.addEventListener('pointerenter', updatePointer);
        image.addEventListener('pointermove', updatePointer);
        image.addEventListener('pointerleave', () => {
          isHovering = false;
        });

        requestAnimationFrame(tick);

        function updatePointer(event) {
          isHovering = true;
          x = event.clientX;
          y = event.clientY;
        }

        function tick() {
          if (isHovering && performance.now() - lastSpawnAt >= 45) {
            lastSpawnAt = performance.now();
            spawnParticle(x, y);

            if (Math.random() > 0.7) {
              spawnParticle(x, y);
            }
          }

          requestAnimationFrame(tick);
        }

        function spawnParticle(originX, originY) {
          const particle = document.createElement('span');
          const color = pick(colors);

          particle.className = 'pixel-brush-particle';
          particle.style.setProperty('--x', `${originX + random(-8, 8)}px`);
          particle.style.setProperty('--y', `${originY + random(-8, 8)}px`);
          particle.style.setProperty('--dx', `${random(-40, 40)}px`);
          particle.style.setProperty('--dy', `${random(-60, -10)}px`);
          particle.style.setProperty('--size', `${Math.round(random(6, 16))}px`);
          particle.style.setProperty('--color', color);
          particle.style.setProperty('--rotation', `${random(0, 90)}deg`);
          particle.style.setProperty('--spin', `${random(-180, 180)}deg`);
          particle.style.setProperty('--life', `${random(700, 1200)}ms`);

          document.body.appendChild(particle);
          particle.addEventListener('animationend', () => particle.remove(), { once: true });
        }
      }

      function random(min, max) {
        return Math.random() * (max - min) + min;
      }

      function pick(items) {
        return items[Math.floor(Math.random() * items.length)];
      }
    })();
  </script>
</body>
</html>
