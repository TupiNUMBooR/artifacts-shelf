<!doctype html>
<html>
<head>
  <!-- version: 2026-05-06-14-20-clean-refactor -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link id="favicon" rel="icon" type="image/svg+xml" href="assets/favicon-1.svg">
  <title>{{ page.title }}</title>

  <style>
    :root {
      --bg: #1a1a1a;
      --panel: #333;
      --text: #fff;
      --link: #9f0;
      --cyan: #20f7ff;
      --violet: #b020ff;
      --muted: #60606a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    a { color: var(--link); }

    main {
      width: min(100% - 24px, 1200px);
      margin: auto;
      padding: clamp(18px, 4vw, 36px) 0;
    }

    img,
    video,
    iframe {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
    }

    pre,
    table {
      max-width: 100%;
      overflow-x: auto;
    }

    table { display: block; }

    h1,
    h2 {
      margin: 0 0 18px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--link);
      line-height: 1.15;
    }

    h1 { font-size: clamp(2rem, 4vw, 3rem); }
    h2 { font-size: clamp(1.7rem, 3vw, 2.35rem); }

    .language-bar {
      display: none;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .language-bar.visible { display: flex; }

    .language-select {
      max-width: 100%;
      padding: 8px 12px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--link);
      border-radius: 10px;
      font: inherit;
      outline: none;
    }

    .language-select:focus { box-shadow: 0 0 0 2px #9f04; }

    .content,
    .panel {
      background: var(--panel);
      border-radius: 18px;
      box-shadow: 0 0 20px #0008;
    }

    .content {
      padding: clamp(16px, 4vw, 24px);
    }

    .content.hidden { display: none; }

    .content.enhanced {
      padding: 0;
      background: none;
      border-radius: 0;
      box-shadow: none;
    }

    .panel {
      position: relative;
      overflow: hidden;
      margin-bottom: clamp(18px, 5vw, 32px);
      padding: clamp(16px, 4vw, 24px);
    }

    .panel.hero { padding-block: clamp(22px, 5vw, 34px); }
    .panel.hero h1 { margin-bottom: 0; }
    .panel > :last-child { margin-bottom: 0; }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background:
        radial-gradient(circle at 20% 0%, #9f03, transparent 34%),
        radial-gradient(circle at 90% 20%, #20f7ff22, transparent 26%);
    }

    .panel > * {
      position: relative;
      z-index: 1;
    }

    .pixel-brush-particle {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 99999;
      width: var(--size);
      height: var(--size);
      border: 2px solid var(--color);
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 0 8px var(--color), inset 0 0 4px #000;
      animation: pixel-brush-drift var(--life) linear forwards;
    }

    .pixel-brush-particle::after {
      content: "";
      position: absolute;
      inset: 35%;
      background: var(--color);
      opacity: 0.85;
      box-shadow: 0 0 6px var(--color);
    }

    @keyframes pixel-brush-drift {
      0% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) rotate(var(--rotation)) scale(0.35);
      }

      12% { opacity: 1; }

      100% {
        opacity: 0;
        transform:
          translate(calc(var(--x) + var(--dx)), calc(var(--y) + var(--dy)))
          rotate(calc(var(--rotation) + var(--spin)))
          scale(0.9);
      }
    }

    @media (max-width: 520px) {
      main { width: min(100% - 16px, 960px); }

      .language-bar { justify-content: stretch; }
      .language-select { width: 100%; }

      .content,
      .panel {
        border-radius: 14px;
      }

      h1 { font-size: 1.75rem; }
      h2 { font-size: 1.45rem; }
    }
  </style>
</head>

<body>
  <main>
    <div id="language-bar" class="language-bar">
      <select id="language-select" class="language-select" aria-label="Language">
        <option value="en">English</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    {{ content }}
  </main>

  <script>
    (() => {
      const titleFallback = document.title;
      const $ = (id) => document.getElementById(id);
      const random = (min, max) => Math.random() * (max - min) + min;
      const pick = (items) => items[Math.floor(Math.random() * items.length)];

      init();

      function init() {
        animateFavicon();
        initLanguage();
        initPixelBrushParticles();
      }

      function animateFavicon() {
        const favicon = $('favicon');
        if (!favicon) return;

        const frames = [
          'assets/favicon-1.svg',
          'assets/favicon-2.svg',
          'assets/favicon-3.svg',
          'assets/favicon-2.svg'
        ];

        let frame = 0;

        setInterval(() => {
          frame = (frame + 1) % frames.length;
          favicon.href = frames[frame];
        }, 700);
      }

      function initLanguage() {
        const content = {
          en: $('content-en'),
          ru: $('content-ru')
        };

        if (!content.en && !content.ru) return;

        const bar = $('language-bar');
        const select = $('language-select');

        bar.classList.add('visible');
        select.addEventListener('change', () => show(select.value));

        show(getSavedLanguage() || getBrowserLanguage());

        function show(language) {
          const selected = content[language] ? language : 'en';

          for (const key of Object.keys(content)) {
            content[key]?.classList.toggle('hidden', key !== selected);
          }

          enhance(content[selected]);
          syncTitle(content[selected]);

          select.value = selected;
          localStorage.setItem('artifact-shelf-language', selected);
        }

        function getSavedLanguage() {
          const saved = localStorage.getItem('artifact-shelf-language');
          return content[saved] ? saved : '';
        }

        function getBrowserLanguage() {
          return navigator.language.toLowerCase().startsWith('ru') ? 'ru' : 'en';
        }
      }

      function enhance(content) {
        if (!content || content.dataset.enhanced) return;

        const panels = [];
        let panel = null;

        for (const node of [...content.childNodes]) {
          if (isSectionHeading(node)) {
            panel = document.createElement('section');
            panel.className = node.tagName === 'H1' ? 'panel hero' : 'panel';
            panels.push(panel);
          }

          panel?.appendChild(node);
        }

        if (!panels.length) return;

        content.replaceChildren(...panels);
        content.classList.add('enhanced');
        content.dataset.enhanced = 'true';
      }

      function isSectionHeading(node) {
        return node.nodeType === Node.ELEMENT_NODE && ['H1', 'H2'].includes(node.tagName);
      }

      function syncTitle(content) {
        const title = content?.querySelector('h1')?.textContent.trim();
        document.title = title || titleFallback;
      }

      function initPixelBrushParticles() {
        const images = [...document.images].filter((img) =>
          `${img.src} ${img.currentSrc} ${img.getAttribute('src')}`
            .toLowerCase()
            .includes('pixel_ai_brush')
        );

        images.forEach(bindParticles);
      }

      function bindParticles(image) {
        if (image.dataset.pixelBrushParticles) return;
        image.dataset.pixelBrushParticles = 'true';

        let hovering = false;
        let lastSpawn = 0;
        let x = 0;
        let y = 0;

        image.addEventListener('pointerenter', move);
        image.addEventListener('pointermove', move);
        image.addEventListener('pointerleave', () => hovering = false);

        requestAnimationFrame(tick);

        function move(event) {
          hovering = true;
          x = event.clientX;
          y = event.clientY;
        }

        function tick(now) {
          if (hovering && now - lastSpawn > 45) {
            lastSpawn = now;
            spawnParticle(x, y);
            if (Math.random() > 0.7) spawnParticle(x, y);
          }

          requestAnimationFrame(tick);
        }
      }

      function spawnParticle(x, y) {
        const particle = document.createElement('span');
        const color = pick(['#9f0', '#20f7ff', '#b020ff', '#60606a']);

        particle.className = 'pixel-brush-particle';
        particle.style.cssText = `
          --x: ${x + random(-8, 8)}px;
          --y: ${y + random(-8, 8)}px;
          --dx: ${random(-40, 40)}px;
          --dy: ${random(-60, -10)}px;
          --size: ${Math.round(random(6, 16))}px;
          --color: ${color};
          --rotation: ${random(0, 90)}deg;
          --spin: ${random(-180, 180)}deg;
          --life: ${random(700, 1200)}ms;
        `;

        document.body.appendChild(particle);
        particle.addEventListener('animationend', () => particle.remove(), { once: true });
      }
    })();
  </script>
</body>
</html>
