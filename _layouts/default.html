<!doctype html>
<html>
<head>
  <!-- artifact-shelf-layout-version: particles-2026-05-06-02 -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link id="favicon" rel="icon" type="image/svg+xml" href="assets/favicon-1.svg">
  <title>{{ page.title }}</title>

  <style>
    :root {
      --bg: #1a1a1a;
      --panel: #333;
      --text: #fff;
      --link: #9f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    a {
      color: var(--link);
    }

    main {
      width: min(100% - 24px, 960px);
      margin: 0 auto;
      padding: clamp(18px, 4vw, 36px) 0;
    }

    img,
    video,
    iframe {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
    }

    pre {
      overflow-x: auto;
      max-width: 100%;
    }

    table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
    }

    .language-bar {
      display: none;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .language-select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--link);
      border-radius: 10px;
      padding: 8px 12px;
      font: inherit;
      outline: none;
      max-width: 100%;
    }

    .language-select:focus {
      box-shadow: 0 0 0 2px #9f04;
    }

    .content {
      background: var(--panel);
      border-radius: 18px;
      padding: clamp(16px, 4vw, 24px);
      box-shadow: 0 0 20px #0008;
    }

    .content.hidden {
      display: none;
    }

    h1 {
      border-bottom: 2px solid var(--link);
      padding-bottom: 8px;
      margin-top: 48px;
      line-height: 1.15;
    }

    h1:first-child {
      margin-top: 0;
    }

    .content.enhanced {
      background: transparent;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
    }

    .panel {
      background: var(--panel);
      border-radius: 18px;
      padding: clamp(16px, 4vw, 24px);
      margin-bottom: clamp(18px, 5vw, 32px);
      box-shadow: 0 0 20px #0008;
    }

    .panel h1 {
      margin-top: 0;
    }

    .pixel-brush-particle {
      position: fixed;
      left: 0;
      top: 0;
      width: var(--size);
      height: var(--size);
      border: 2px solid var(--color);
      pointer-events: none;
      z-index: 99999;
      opacity: 0;
      box-shadow:
        0 0 8px var(--color),
        inset 0 0 4px #000;
      animation: pixel-brush-drift var(--life) linear forwards;
    }

    .pixel-brush-particle::after {
      content: "";
      position: absolute;
      inset: 35%;
      background: var(--color);
      box-shadow: 0 0 6px var(--color);
    }

    @keyframes pixel-brush-drift {
      0% {
        opacity: 0;
        transform:
          translate(var(--x), var(--y))
          rotate(var(--rotation))
          scale(0.4);
      }

      15% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform:
          translate(
            calc(var(--x) + var(--dx)),
            calc(var(--y) + var(--dy))
          )
          rotate(calc(var(--rotation) + var(--spin)))
          scale(1);
      }
    }

    @media (max-width: 520px) {
      main {
        width: min(100% - 16px, 960px);
      }

      .language-bar {
        justify-content: stretch;
      }

      .language-select {
        width: 100%;
      }

      .content,
      .panel {
        border-radius: 14px;
      }

      h1 {
        font-size: 1.55rem;
        margin-top: 36px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div id="language-bar" class="language-bar">
      <select id="language-select" class="language-select" aria-label="Language">
        <option value="en">English</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    {{ content }}
  </main>

  <script>
    (() => {
      console.log('[artifact-shelf] layout version: particles-2026-05-06-02');

      const faviconFrames = [
        'assets/favicon-1.svg',
        'assets/favicon-2.svg',
        'assets/favicon-3.svg',
        'assets/favicon-2.svg'
      ];

      const favicon = document.getElementById('favicon');
      let faviconFrame = 0;

      if (favicon) {
        setInterval(() => {
          faviconFrame = (faviconFrame + 1) % faviconFrames.length;
          favicon.href = faviconFrames[faviconFrame];
        }, 700);
      }

      const contents = {
        en: document.getElementById('content-en'),
        ru: document.getElementById('content-ru')
      };

      const languageBar = document.getElementById('language-bar');
      const languageSelect = document.getElementById('language-select');

      const availableLanguages = Object
        .entries(contents)
        .filter(([, element]) => element);

      if (availableLanguages.length > 0) {
        function enhanceContent(content) {
          if (!content || content.dataset.enhanced === 'true') {
            return;
          }

          const nodes = Array.from(content.childNodes);
          let panel = null;
          const panels = [];

          for (const node of nodes) {
            const isHeading =
              node.nodeType === Node.ELEMENT_NODE &&
              node.tagName === 'H1';

            if (isHeading) {
              panel = document.createElement('section');
              panel.className = 'panel';
              panels.push(panel);
            }

            if (panel) {
              panel.appendChild(node);
            }
          }

          if (panels.length === 0) {
            return;
          }

          content.textContent = '';
          content.classList.add('enhanced');
          content.dataset.enhanced = 'true';

          for (const item of panels) {
            content.appendChild(item);
          }
        }

        function normalizeLanguage(language) {
          return language && language.toLowerCase().startsWith('ru')
            ? 'ru'
            : 'en';
        }

        function getInitialLanguage() {
          const saved = localStorage.getItem('artifact-shelf-language');

          if (saved === 'en' || saved === 'ru') {
            return saved;
          }

          return normalizeLanguage(navigator.language);
        }

        function showLanguage(language) {
          const selectedLanguage = contents[language] ? language : 'en';

          for (const [key, content] of Object.entries(contents)) {
            if (!content) {
              continue;
            }

            content.classList.toggle('hidden', key !== selectedLanguage);
          }

          enhanceContent(contents[selectedLanguage]);

          languageSelect.value = selectedLanguage;
          localStorage.setItem('artifact-shelf-language', selectedLanguage);
        }

        languageBar.style.display = 'flex';
        showLanguage(getInitialLanguage());

        languageSelect.addEventListener('change', () => {
          showLanguage(languageSelect.value);
        });
      }

      bootPixelBrushParticles();

      function bootPixelBrushParticles() {
        tryStartPixelBrushParticles();
        setTimeout(tryStartPixelBrushParticles, 300);
        setTimeout(tryStartPixelBrushParticles, 1000);

        const observer = new MutationObserver(() => {
          tryStartPixelBrushParticles();
        });

        observer.observe(document.documentElement, {
          childList: true,
          subtree: true
        });
      }

      function tryStartPixelBrushParticles() {
        if (window.__pixelBrushParticlesStarted) {
          return;
        }

        const image = Array
          .from(document.images)
          .find((img) => {
            const source = [
              img.getAttribute('src') || '',
              img.currentSrc || '',
              img.src || ''
            ].join(' ').toLowerCase();

            return source.includes('pixel_ai_brush');
          });

        if (!image) {
          console.log('[pixel-brush] waiting for image...');
          return;
        }

        startPixelBrushParticles(image);
      }

      function startPixelBrushParticles(image) {
        window.__pixelBrushParticlesStarted = true;
        console.log('[pixel-brush] attached to image:', image);

        const colors = ['#9f0', '#20f7ff', '#b020ff', '#666a76'];
        let hovering = false;
        let pointerX = 0;
        let pointerY = 0;
        let lastSpawn = 0;

        function random(min, max) {
          return Math.random() * (max - min) + min;
        }

        function spawnParticle(x, y) {
          const particle = document.createElement('span');
          const color = colors[Math.floor(Math.random() * colors.length)];

          particle.className = 'pixel-brush-particle';
          particle.style.setProperty('--x', `${x + random(-8, 8)}px`);
          particle.style.setProperty('--y', `${y + random(-8, 8)}px`);
          particle.style.setProperty('--dx', `${random(-40, 40)}px`);
          particle.style.setProperty('--dy', `${random(-60, -10)}px`);
          particle.style.setProperty('--size', `${Math.round(random(6, 16))}px`);
          particle.style.setProperty('--color', color);
          particle.style.setProperty('--rotation', `${random(0, 90)}deg`);
          particle.style.setProperty('--spin', `${random(-180, 180)}deg`);
          particle.style.setProperty('--life', `${random(700, 1200)}ms`);

          document.body.appendChild(particle);

          particle.addEventListener('animationend', () => {
            particle.remove();
          }, { once: true });
        }

        image.addEventListener('pointerenter', (event) => {
          hovering = true;
          pointerX = event.clientX;
          pointerY = event.clientY;
          console.log('[pixel-brush] hover start');
        });

        image.addEventListener('pointermove', (event) => {
          hovering = true;
          pointerX = event.clientX;
          pointerY = event.clientY;
        });

        image.addEventListener('pointerleave', () => {
          hovering = false;
          console.log('[pixel-brush] hover end');
        });

        function loop() {
          if (hovering) {
            const now = performance.now();

            if (now - lastSpawn > 45) {
              lastSpawn = now;

              spawnParticle(pointerX, pointerY);

              if (Math.random() > 0.7) {
                spawnParticle(pointerX, pointerY);
              }
            }
          }

          requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
      }
    })();
  </script>
</body>
</html>
