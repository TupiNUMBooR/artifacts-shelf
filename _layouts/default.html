<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link id="favicon" rel="icon" type="image/svg+xml" href="assets/favicon-1.svg">
  <title>{{ page.title }}</title>

  <style>
    :root {
      --bg: #1a1a1a;
      --panel: #333;
      --text: #fff;
      --link: #9f0;
      --cyan: #20f7ff;
      --violet: #b020ff;
      --muted-pixel: #60606a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    a {
      color: var(--link);
    }

    main {
      width: min(100% - 24px, 960px);
      margin: 0 auto;
      padding: clamp(18px, 4vw, 36px) 0;
    }

    img,
    video,
    iframe {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
    }

    pre {
      overflow-x: auto;
      max-width: 100%;
    }

    table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
    }

    .language-bar {
      display: none;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .language-select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--link);
      border-radius: 10px;
      padding: 8px 12px;
      font: inherit;
      outline: none;
      max-width: 100%;
    }

    .language-select:focus {
      box-shadow: 0 0 0 2px #9f04;
    }

    .content {
      background: var(--panel);
      border-radius: 18px;
      padding: clamp(16px, 4vw, 24px);
      box-shadow: 0 0 20px #0008;
    }

    .content.hidden {
      display: none;
    }

    h1 {
      border-bottom: 2px solid var(--link);
      padding-bottom: 8px;
      margin-top: 48px;
      line-height: 1.15;
    }

    h1:first-child {
      margin-top: 0;
    }

    .content.enhanced {
      background: transparent;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
    }

    .panel {
      position: relative;
      overflow: hidden;
      background: var(--panel);
      border-radius: 18px;
      padding: clamp(16px, 4vw, 24px);
      margin-bottom: clamp(18px, 5vw, 32px);
      box-shadow: 0 0 20px #0008;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background:
        radial-gradient(circle at 20% 0%, #9f03, transparent 34%),
        radial-gradient(circle at 90% 20%, #20f7ff22, transparent 26%);
    }

    .panel > * {
      position: relative;
      z-index: 1;
    }

    .panel h1 {
      margin-top: 0;
    }

    .cursor-particle-layer {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      overflow: hidden;
    }

    .cursor-particle {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--size);
      height: var(--size);
      border: 2px solid var(--color);
      transform:
        translate(var(--x), var(--y))
        rotate(var(--rotation))
        scale(1);
      opacity: 0;
      box-shadow:
        0 0 8px var(--color),
        inset 0 0 6px #000;
      animation: cursor-particle-drift var(--life) linear forwards;
    }

    .cursor-particle::after {
      content: "";
      position: absolute;
      inset: 35%;
      background: var(--color);
      opacity: 0.85;
      box-shadow: 0 0 8px var(--color);
    }

    @keyframes cursor-particle-drift {
      0% {
        opacity: 0;
        transform:
          translate(var(--x), var(--y))
          rotate(var(--rotation))
          scale(0.35);
      }

      12% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform:
          translate(
            calc(var(--x) + var(--dx)),
            calc(var(--y) + var(--dy))
          )
          rotate(calc(var(--rotation) + var(--spin)))
          scale(0.9);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-particle-layer {
        display: none;
      }
    }

    @media (max-width: 520px) {
      main {
        width: min(100% - 16px, 960px);
      }

      .language-bar {
        justify-content: stretch;
      }

      .language-select {
        width: 100%;
      }

      .content,
      .panel {
        border-radius: 14px;
      }

      h1 {
        font-size: 1.55rem;
        margin-top: 36px;
      }
    }
  </style>
</head>

<body>
  <div id="cursor-particle-layer" class="cursor-particle-layer" aria-hidden="true"></div>

  <main>
    <div id="language-bar" class="language-bar">
      <select id="language-select" class="language-select" aria-label="Language">
        <option value="en">English</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    {{ content }}
  </main>

  <script>
    (() => {
      const faviconFrames = [
        'assets/favicon-1.svg',
        'assets/favicon-2.svg',
        'assets/favicon-3.svg',
        'assets/favicon-2.svg'
      ];

      const favicon = document.getElementById('favicon');
      let faviconFrame = 0;

      if (favicon) {
        setInterval(() => {
          faviconFrame = (faviconFrame + 1) % faviconFrames.length;
          favicon.href = faviconFrames[faviconFrame];
        }, 700);
      }

      const contents = {
        en: document.getElementById('content-en'),
        ru: document.getElementById('content-ru')
      };

      const languageBar = document.getElementById('language-bar');
      const languageSelect = document.getElementById('language-select');

      const availableLanguages = Object
        .entries(contents)
        .filter(([, element]) => element);

      if (availableLanguages.length === 0) {
        startCursorParticles();
        return;
      }

      function enhanceContent(content) {
        if (!content || content.dataset.enhanced === 'true') {
          return;
        }

        const nodes = Array.from(content.childNodes);
        let panel = null;
        const panels = [];

        for (const node of nodes) {
          const isHeading =
            node.nodeType === Node.ELEMENT_NODE &&
            node.tagName === 'H1';

          if (isHeading) {
            panel = document.createElement('section');
            panel.className = 'panel';
            panels.push(panel);
          }

          if (panel) {
            panel.appendChild(node);
          }
        }

        if (panels.length === 0) {
          return;
        }

        content.textContent = '';
        content.classList.add('enhanced');
        content.dataset.enhanced = 'true';

        for (const item of panels) {
          content.appendChild(item);
        }
      }

      function normalizeLanguage(language) {
        return language && language.toLowerCase().startsWith('ru')
          ? 'ru'
          : 'en';
      }

      function getInitialLanguage() {
        const saved = localStorage.getItem('artifact-shelf-language');

        if (saved === 'en' || saved === 'ru') {
          return saved;
        }

        return normalizeLanguage(navigator.language);
      }

      function showLanguage(language) {
        const selectedLanguage = contents[language] ? language : 'en';

        for (const [key, content] of Object.entries(contents)) {
          if (!content) {
            continue;
          }

          content.classList.toggle('hidden', key !== selectedLanguage);
        }

        enhanceContent(contents[selectedLanguage]);

        languageSelect.value = selectedLanguage;
        localStorage.setItem('artifact-shelf-language', selectedLanguage);
      }

      languageBar.style.display = 'flex';
      showLanguage(getInitialLanguage());

      languageSelect.addEventListener('change', () => {
        showLanguage(languageSelect.value);
      });

      startCursorParticles();

      function startCursorParticles() {
        const layer = document.getElementById('cursor-particle-layer');

        if (!layer || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          return;
        }

        const colors = ['#9f0', '#20f7ff', '#b020ff', '#666a76'];
        let lastSpawn = 0;

        function random(min, max) {
          return Math.random() * (max - min) + min;
        }

        function spawnParticle(x, y) {
          const particle = document.createElement('span');
          const color = colors[Math.floor(Math.random() * colors.length)];
          const size = Math.round(random(7, 18));
          const driftX = random(-34, 34);
          const driftY = random(-48, -14);

          particle.className = 'cursor-particle';
          particle.style.setProperty('--x', `${x + random(-8, 8)}px`);
          particle.style.setProperty('--y', `${y + random(-8, 8)}px`);
          particle.style.setProperty('--dx', `${driftX}px`);
          particle.style.setProperty('--dy', `${driftY}px`);
          particle.style.setProperty('--size', `${size}px`);
          particle.style.setProperty('--color', color);
          particle.style.setProperty('--rotation', `${random(0, 90)}deg`);
          particle.style.setProperty('--spin', `${random(-90, 90)}deg`);
          particle.style.setProperty('--life', `${random(650, 1100)}ms`);

          layer.appendChild(particle);

          particle.addEventListener('animationend', () => {
            particle.remove();
          }, { once: true });
        }

        window.addEventListener('pointermove', (event) => {
          const now = performance.now();

          if (now - lastSpawn < 45) {
            return;
          }

          lastSpawn = now;

          const target = event.target;
          const isHotZone =
            target.closest &&
            target.closest('a, img, .panel, .language-select, button');

          if (!isHotZone) {
            return;
          }

          spawnParticle(event.clientX, event.clientY);

          if (Math.random() > 0.72) {
            spawnParticle(event.clientX, event.clientY);
          }
        }, { passive: true });
      }
    })();
  </script>
</body>
</html>
